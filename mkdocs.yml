site_name: Agent Workspace
site_url: https://zkmkarlsruhe.github.io/agent-workspace-docs/
repo_url: https://github.com/zkmkarlsruhe/agent-workspace-docs
repo_name: zkmkarlsruhe/agent-workspace-docs
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - pymdownx.superfences
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav: [{"Home": "README.md"}, "CONTRACTS.md", "CONTRIBUTING.md", "IDENTITY.md", "INSTALL.md", "architecture.md", "connect-litellm.md", "connect-provider.md", "instance.md", "mcp-server.md", "privacy.md", {"ADRs": ["adr/README.md", "adr/d06-personal-runtimes.md", "adr/d09-task-folders.md", "adr/d12-manager.md", "adr/d15-model-credentials.md", "adr/d30-egress.md", "adr/d33-provisioner.md", "adr/d44-docker.md", "adr/d46-service-credentials.md", "adr/d48-private-chats.md", "adr/d49-mail.md", "adr/d58-cloud-files.md", "adr/d59-central-mcp.md", "adr/d60-toolboxes.md", "adr/d62-product-name.md", "adr/d64-identity-guard.md"]}]
