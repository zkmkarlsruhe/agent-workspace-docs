<svg viewBox="0 0 720 478" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:1.2}
    .core{fill:#eef3f8;stroke:#2c5d8a;stroke-width:1.6}
    .user{fill:#f7f7f2;stroke:#777;stroke-width:1.1}
    .ext{fill:#fafafa;stroke:#999;stroke-width:1.1;stroke-dasharray:4 3}
    .zone{fill:none;stroke:#bbb;stroke-width:1;stroke-dasharray:2 3}
    .t{font-weight:700;font-size:12px}
    .s{fill:#444;font-size:10.5px}
    .l{stroke:#444;stroke-width:1.2;fill:none}
    .lab{fill:#555;font-size:10px;font-style:italic}
  </style>

  <!-- browser -->
  <rect class="box" x="20" y="20" width="160" height="56" rx="6"/>
  <text class="t" x="100" y="43" text-anchor="middle">Browser</text>
  <text class="s" x="100" y="61" text-anchor="middle">Portal &amp; personal address</text>

  <!-- edge -->
  <rect class="box" x="20" y="120" width="160" height="56" rx="6"/>
  <text class="t" x="100" y="143" text-anchor="middle">Edge proxy</text>
  <text class="s" x="100" y="161" text-anchor="middle">TLS, login check</text>
  <path class="l" d="M100,76 V120" marker-end="url(#a)"/>

  <!-- idp -->
  <rect class="ext" x="230" y="120" width="150" height="56" rx="6"/>
  <text class="t" x="305" y="143" text-anchor="middle">Identity Provider</text>
  <text class="s" x="305" y="161" text-anchor="middle">Single sign-on, identity</text>
  <path class="l" d="M180,148 H230" marker-end="url(#a)"/>

  <!-- manager -->
  <rect class="core" x="20" y="220" width="400" height="92" rx="8"/>
  <text class="t" x="220" y="243" text-anchor="middle">Session manager</text>
  <text class="s" x="40" y="264">Portal: projects, tools, cleanup</text>
  <text class="s" x="40" y="280">Routing: person → own environment</text>
  <text class="s" x="40" y="296">Lifecycle: start on demand, stop when idle</text>
  <text class="s" x="290" y="264">LLM gateway</text>
  <text class="s" x="290" y="280">MCP gateway</text>
  <text class="s" x="290" y="296">inserts credentials</text>
  <path class="l" d="M100,176 V220" marker-end="url(#a)"/>

  <!-- user zone -->
  <rect class="zone" x="20" y="345" width="400" height="110" rx="8"/>
  <text class="lab" x="220" y="468" text-anchor="middle">isolated network per person, no direct internet access</text>
  <rect class="user" x="35" y="372" width="175" height="70" rx="6"/>
  <text class="t" x="122" y="395" text-anchor="middle">Environment A</text>
  <text class="s" x="122" y="412" text-anchor="middle">OpenCode server</text>
  <text class="s" x="122" y="428" text-anchor="middle">many chats, many projects</text>
  <rect class="user" x="230" y="372" width="175" height="70" rx="6"/>
  <text class="t" x="317" y="395" text-anchor="middle">Environment B</text>
  <text class="s" x="317" y="412" text-anchor="middle">OpenCode server</text>
  <text class="s" x="317" y="428" text-anchor="middle">many chats, many projects</text>
  <path class="l" d="M122,312 V372" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="l" d="M317,312 V372" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- right side services -->
  <rect class="ext" x="490" y="220" width="210" height="56" rx="6"/>
  <text class="t" x="595" y="243" text-anchor="middle">Configured model endpoint</text>
  <text class="s" x="595" y="261" text-anchor="middle">Models, costs per person</text>
  <path class="l" d="M420,250 H490" marker-end="url(#a)"/>
  <text class="lab" x="455" y="242" text-anchor="middle">+ key</text>

  <rect class="ext" x="490" y="296" width="210" height="56" rx="6"/>
  <text class="t" x="595" y="319" text-anchor="middle">Enabled services via MCP</text>
  <text class="s" x="595" y="337" text-anchor="middle">Approved read-only tools</text>
  <path class="l" d="M420,292 C455,292 460,324 490,324" marker-end="url(#a)"/>

  <rect class="ext" x="490" y="380" width="210" height="62" rx="6"/>
  <text class="t" x="595" y="403" text-anchor="middle">Persistent storage</text>
  <text class="s" x="595" y="420" text-anchor="middle">Projects, chats, personal skills</text>
  <text class="s" x="595" y="434" text-anchor="middle">one directory per person</text>
  <path class="l" d="M405,407 H490" marker-end="url(#a)"/>
</svg>
