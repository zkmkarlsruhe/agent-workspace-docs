name: Documentation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: agent-workspace-docs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zkmkarlsruhe/agent-workspace
          path: agent-workspace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m venv /tmp/workspace-docs-venv
          /tmp/workspace-docs-venv/bin/pip install --require-hashes -r agent-workspace-docs/requirements.txt
          echo /tmp/workspace-docs-venv/bin >> "$GITHUB_PATH"
      - name: Strict documentation build
        working-directory: agent-workspace-docs
        run: mkdocs build --strict
      - name: Links, Markdown, semantic and licence checks
        working-directory: agent-workspace-docs
        run: python3 -I -B -m unittest discover -s tests/export -v
